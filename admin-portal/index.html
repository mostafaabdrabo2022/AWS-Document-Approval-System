<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>لوحة إشراف الطلبات</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: #f4f7f6; padding: 20px; }
        .container { max-width: 1000px; margin: auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: center; }
        th { background: #2c3e50; color: white; }
        .btn-approve { background: #2ecc71; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; }
        .btn-reject { background: #e74c3c; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; }
        .badge { padding: 4px 8px; border-radius: 4px; font-weight: bold; }
        .Pending { background: #f1c40f; color: #fff; }
        .Approved { background: #2ecc71; color: #fff; }
        .Rejected { background: #e74c3c; color: #fff; }
    </style>
</head>
<body>
    <div class="container">
        <h2>🛠️ لوحة إشراف الطلبات (Live)</h2>
        <table>
            <thead>
                <tr>
                    <th>رقم الطلب</th>
                    <th>الاسم</th>
                    <th>الإيميل</th>
                    <th>المستند / الإقرار</th>
                    <th>الحالة</th>
                    <th>القرار</th>
                </tr>
            </thead>
            <tbody id="requestsTable">
                <tr><td colspan="6">جاري تحميل البيانات...</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        // تم استبدال الروابط الوهمية بالرابط الحقيقي وتعديل مسار القرار إلى /decision
        const GET_API = 'https://732ja9c7i0.execute-api.us-east-1.amazonaws.com/dev/documents';
        const ACTION_API = 'https://732ja9c7i0.execute-api.us-east-1.amazonaws.com/dev/decision';

        async function loadDocuments() {
            try {
                const res = await fetch(GET_API);
                if (!res.ok) throw new Error("فشل جلب البيانات");
                
                const docs = await res.json();
                const tbody = document.getElementById('requestsTable');
                tbody.innerHTML = '';

                if (!docs || docs.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="6">لا توجد طلبات معروضة حالياً</td></tr>`;
                    return;
                }

                docs.forEach(doc => {
                    const statusClass = doc.status || 'Pending';
                    tbody.innerHTML += `
                        <tr>
                            <td>${doc.document_id || '-'}</td>
                            <td>${doc.user_name || 'غير محدد'}</td>
                            <td>${doc.user_email || '-'}</td>
                            <td>${doc.file_name || '-'}<br><small>${doc.declaration || ''}</small></td>
                            <td><span class="badge ${statusClass}">${statusClass}</span></td>
                            <td>
                                <button class="btn-approve" onclick="updateStatus('${doc.document_id}', 'Approved')">موافقة</button>
                                <button class="btn-reject" onclick="updateStatus('${doc.document_id}', 'Rejected')">رفض</button>
                            </td>
                        </tr>
                    `;
                });
            } catch(e) {
                console.error(e);
                document.getElementById('requestsTable').innerHTML = `<tr><td colspan="6" style="color: red;">فشل الاتصال بالخادم لجلب البيانات</td></tr>`;
            }
        }

        async function updateStatus(docId, decision) {
            try {
                const res = await fetch(ACTION_API, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ document_id: docId, decision: decision })
                });
                if(res.ok) {
                    alert(`تم تحديث الحالة بنجاح`);
                    loadDocuments(); // إعادة تحميل الجدول فوراً
                } else {
                    alert('فشل تحديث الحالة من الخادم');
                }
            } catch(e) {
                console.error(e);
                alert('فشل الاتصال');
            }
        }

        loadDocuments();
    </script>
</body>
</html>
