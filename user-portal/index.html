<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تقديم طلب جديد</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: #f4f7f6; padding: 40px; }
        .card { max-width: 500px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #333; margin-bottom: 20px; }
        label { font-weight: bold; display: block; margin-top: 15px; color: #555; }
        input, textarea { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #0066cc; color: white; border: none; border-radius: 6px; font-size: 16px; margin-top: 20px; cursor: pointer; }
        button:hover { background: #0052a3; }
    </style>
</head>
<body>
    <div class="card">
        <h2>📄 تقديم مستند / إقرار جديد</h2>
        <form id="submitForm">
            <label>اسم المتقدم بالكامل:</label>
            <input type="text" id="userName" required placeholder="أدخل اسمك">

            <label>البريد الإلكتروني:</label>
            <input type="email" id="userEmail" required placeholder="example@mail.com">

            <label>نص الإقرار / الملاحظات:</label>
            <textarea id="declaration" rows="3" placeholder="اكتب أى إقرار أو تفاصيل إضافية هنا..."></textarea>

            <label>مرفق المستند (اختياري):</label>
            <input type="file" id="fileInput">

            <button type="submit">إرسال الطلب</button>
        </form>
    </div>

    <script>
        // تم استبدال YOUR_API_GATEWAY_URL بالرابط الحقيقي
        const API_URL = 'https://732ja9c7i0.execute-api.us-east-1.amazonaws.com/dev/submit';

        document.getElementById('submitForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const file = document.getElementById('fileInput').files[0];
            
            const payload = {
                user_name: document.getElementById('userName').value,
                user_email: document.getElementById('userEmail').value,
                declaration: document.getElementById('declaration').value,
                file_name: file ? file.name : "بدون ملف مرفق"
            };

            try {
                const res = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                if(res.ok) {
                    alert(`تم إرسال الطلب بنجاح! رقم الطلب: ${data.document_id}`);
                    document.getElementById('submitForm').reset();
                } else {
                    alert(`خطأ: ${data.message || 'حدث خطأ في معالجة الطلب'}`);
                }
            } catch(err) {
                console.error(err);
                alert("فشل الاتصال بالخادم. تحقق من إعدادات الشبكة أو الـ API Gateway");
            }
        });
    </script>
</body>
</html>
